const HomeDemo={cartCount:3,claimed:new Set(),favorite:false};
const $=id=>document.getElementById(id);const dialog=$('demo-dialog');let toastTimer,lastFocus;
function openDemo(title,body){lastFocus=document.activeElement;$('dialog-title').textContent=title;$('dialog-body').replaceChildren();if(typeof body==='string')$('dialog-body').textContent=body;else $('dialog-body').append(body);dialog.showModal()}
function closeDemo(){dialog.close();lastFocus?.focus()}
function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2800)}
function renderCount(){document.querySelectorAll('[data-cart-count]').forEach(n=>n.textContent=HomeDemo.cartCount)}
function cart(){const section=document.createElement('div');const note=document.createElement('p');note.textContent='示範購物車：初始 3 件為母版演示數量，可在此測試增減。';section.append(note);const row=document.createElement('div');row.className='demo-cart-row';row.append(document.createTextNode('示範商品'));const controls=document.createElement('div');const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','減少示範数量');const count=document.createElement('span');count.textContent=HomeDemo.cartCount;const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','增加示範数量');function sync(){count.textContent=HomeDemo.cartCount;minus.disabled=HomeDemo.cartCount===0;renderCount()}minus.onclick=()=>{HomeDemo.cartCount=Math.max(0,HomeDemo.cartCount-1);sync()};plus.onclick=()=>{HomeDemo.cartCount++;sync()};controls.append(minus,count,plus);row.append(controls);section.append(row);sync();openDemo('示範購物車',section)}
function action(name){if(name==='cart'){cart();return}if(name==='brands'){document.getElementById('brands').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}if(name==='product'){openDemo('MEVIUS Original','母版演示商品：¥4,250／條。真實名稱、規格、售價、優惠、庫存及詳情地址由正式商城接口提供。');return}if(name==='register'){openDemo('新會員註冊','母版展示「贈送500點」。正式活動條件尚未接入；本原型不建立帳號、不收集個人資料。');return}openDemo(name==='categories'?'商品分類':name==='account'?'會員中心':'原型說明','此入口展示互動位置。正式頁面需由協調員核實既有路由後接入；目前不跳轉或登入商城。')}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>b.dataset.nav==='home'?window.scrollTo({top:0,behavior:'smooth'}):action(b.dataset.nav));
document.querySelectorAll('[data-coupon]').forEach(b=>b.onclick=()=>{const value=b.dataset.coupon;if(HomeDemo.claimed.has(value)){toast('此演示優惠券已領取');return}HomeDemo.claimed.add(value);b.classList.add('is-claimed');b.querySelector('em').textContent='已領取（演示）';toast('演示領取成功 · 沒有發放真實優惠券')});
document.querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>openDemo(b.dataset.brand+' 品牌','正式商品列表地址由現有 manufacturer_id 對應確認。本原型只展示品牌入口，不推測實際品牌編號。'));
$('favorite').onclick=()=>{HomeDemo.favorite=!HomeDemo.favorite;$('favorite').setAttribute('aria-pressed',String(HomeDemo.favorite));$('favorite').setAttribute('aria-label',HomeDemo.favorite?'取消收藏示範商品':'收藏示範商品');toast(HomeDemo.favorite?'已收藏（演示）':'已取消收藏（演示）')};$('add-to-cart').onclick=()=>{HomeDemo.cartCount++;renderCount();toast('已加入示範購物車 · 沒有改動商城')};
$('search-form').onsubmit=e=>{e.preventDefault();const q=$('search-input').value.trim();if(!q){$('search-input').focus();toast('請輸入商品或品牌');return}openDemo('搜尋：'+q,'搜尋入口已就位。此原型未發出網絡请求；正式搜尋沿用商城既有路由與服務端結果。')};$('about').onclick=()=>openDemo('交付原型說明','依據19534.jpeg母版重建可操作首頁。素材為母版原圖的SVG視窗引用。所有價格、優惠、銷量、會員點數和購物車數量均為演示，不代表已批准業務規則。');$('dialog-close').onclick=closeDemo;$('dialog-done').onclick=closeDemo;dialog.addEventListener('close',()=>lastFocus?.focus());renderCount();
