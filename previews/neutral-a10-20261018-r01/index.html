:root{--nav-body:50px}

.carousel-arrow.previous{left:10px}.carousel-arrow.next{right:10px}.carousel-arrow.previous .icon{transform:rotate(180deg)}

  font-family:"PingFang TC","Microsoft JhengHei",Arial,sans-serif;
  font-size:6.9cqw;font-weight:400;line-height:1.2;white-space:nowrap;

<script>
(()=>{
const q=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const dialog=q('#demo-dialog');function show(title,text){q('#dialog-title').textContent=title;q('#dialog-body').textContent=text;dialog.showModal()}
let current=0;const slides=all('.hero-slide');function slide(n){current=(n+slides.length)%slides.length;q('.hero-track').style.transform=`translateX(-${current*100}%)`;q('.hero').dataset.activeSlide=current;slides.forEach((e,i)=>{e.inert=i!==current;e.setAttribute('aria-hidden',i!==current)});all('[data-slide-to]').forEach((e,i)=>e.setAttribute('aria-pressed',i===current))}
all('[data-slide-to]').forEach(e=>e.onclick=()=>slide(+e.dataset.slideTo));all('[data-slide-step]').forEach(e=>e.onclick=()=>slide(current+ +e.dataset.slideStep));
let x=0;q('.hero').addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});q('.hero').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>40)slide(current+(d<0?1:-1))},{passive:true});
q('#search-form').onsubmit=e=>{e.preventDefault();show('搜尋筆記',q('#search-input').value.trim()?'搜尋主題：'+q('#search-input').value.trim():'請輸入城市或風景主題。')};
all('[data-coupon]').forEach((e,i)=>e.onclick=()=>show(['東京','京都','大阪'][i],'城市影像與散步靈感的獨立展示筆記。'));
all('[data-brand]').forEach(e=>e.onclick=()=>show(e.dataset.brand,'探索城市的光影、街道與日常風景。'));
q('#favorite').onclick=e=>{const b=e.currentTarget;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
all('[data-action]').forEach(e=>e.onclick=()=>{const a=e.dataset.action;if(a==='brands'){q('#brands').scrollIntoView({behavior:'smooth'});return}show(a==='collection'?'收藏夾':a==='register'?'旅途靈感':'旅の記憶',a==='collection'?'這是獨立視覺展示，沒有購買、訂單或付款功能。':'以影像與文字記錄日本城市的日常風景。')});
q('#add-to-cart').onclick=()=>show('旅の記憶','城市影像作品 004。此預覽不提供商品交易。');
all('[data-nav]').forEach(e=>e.onclick=()=>{all('[data-nav]').forEach(b=>b.classList.toggle('active',b===e));if(e.dataset.nav==='home')window.scrollTo({top:0,behavior:'smooth'});else if(e.dataset.nav==='categories')q('#brands').scrollIntoView({behavior:'smooth'});else show(e.dataset.nav==='collection'?'收藏夾':'個人筆記','僅作前端視覺與互動展示，不連接帳戶或交易系統。')});
q('#dialog-close').onclick=q('#dialog-done').onclick=()=>dialog.close();
all('.coupon').forEach(e=>e.style.setProperty('--ticket-inner-width',e.clientWidth+'px'));
slide(0);
})();</script></body></html>
