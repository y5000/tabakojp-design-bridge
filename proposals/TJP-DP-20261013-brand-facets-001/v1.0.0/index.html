<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabakoJP · 品牌快篩提案</title><style>
:root{--navy:#102c43;--blue:#e9f0f4;--ink:#173047;--muted:#657786;--line:#dbe3e8;--paper:#f7f9fa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #498cba;outline-offset:3px}.demo{padding:7px 20px;background:#eaf0f3;color:#375369;text-align:center;font-size:12px}header{background:var(--navy);color:white;padding:20px max(24px,calc((100% - 1120px)/2));display:flex;align-items:center;gap:36px}header strong{font-size:23px;white-space:nowrap;letter-spacing:2px}form{display:flex;gap:8px;width:100%}input{width:100%;border:0;border-radius:24px;background:#29465d;color:white;padding:12px 18px}input::placeholder{color:#d2dce4}form button{border:1px solid #5e7588;border-radius:24px;background:transparent;color:white;padding:8px 20px}main{max-width:1120px;margin:36px auto;padding:0 24px 100px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:2px}h1{font:32px/1.3 Georgia,serif;margin:12px 0}h1 span{font-size:14px;color:var(--muted);font-family:system-ui}p{margin:8px 0 20px}.panel{padding:24px;background:white;border:1px solid var(--line);border-radius:16px}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.label strong{font-size:14px}.label button,.reset{border:0;background:none;color:#426981;text-decoration:underline}.chips{display:flex;gap:10px;overflow:auto;padding:3px 2px 8px}.chip{flex-shrink:0;border:1px solid var(--line);background:white;border-radius:24px;padding:9px 18px;color:var(--ink)}.chip[aria-pressed=true]{background:var(--navy);color:white;border-color:var(--navy)}.chip b{display:inline-block;margin-left:12px;font-size:12px;opacity:.7}.summary{display:flex;justify-content:space-between;align-items:center;margin:25px 0 15px;gap:12px}.summary select{background:white;border:1px solid var(--line);border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.image{height:190px;display:grid;place-items:center;background:linear-gradient(145deg,#edf2f4,#fbfcfd)}.pack{width:84px;height:118px;border:1px solid #c5d2dc;border-top:9px solid #254b68;background:white;box-shadow:5px 7px 15px #17304712;text-align:center;padding:26px 5px 0;font:20px Georgia}.pack small{display:block;font:8px system-ui;letter-spacing:2px;margin-top:10px}.body{padding:16px}.body small{color:var(--muted)}.body h2{font-size:17px;margin:5px 0}.body button{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);margin-top:15px}.empty{padding:46px 20px;text-align:center;background:white;border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}.pager{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:26px}.pager button,.retry{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 18px;color:var(--ink)}footer{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#becdd7;display:flex;justify-content:center;gap:90px;padding:14px;font-size:13px}.qa{margin-top:35px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;font-size:12px}.qa select{max-width:100%}dialog{border:1px solid var(--line);border-radius:16px;max-width:calc(100% - 32px);padding:24px}dialog::backdrop{background:#102c4370}[hidden]{display:none!important}@media(max-width:600px){header{padding:16px;gap:12px;flex-wrap:wrap}header strong{font-size:20px}form{gap:6px}input{min-width:0}main{margin:23px auto;padding:0 16px 100px}h1{font-size:27px}.panel{padding:17px 14px}.chips{margin-right:-14px;padding-right:14px}.chip{padding:8px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.image{height:158px}.body{padding:12px}.body h2{font-size:15px}.summary{font-size:12px}.summary select{max-width:140px}.demo{font-size:11px}footer{justify-content:space-around;gap:0}.pack{transform:scale(.9)} }
</style></head><body><div class="demo">設計提案 v1.0.0 · 所有商品與數量均為模擬 · 未連接商城</div><header><strong>TabakoJP</strong><form id="search"><input id="q" aria-label="搜尋商品或品牌" placeholder="搜尋商品或品牌" value="日本香煙"><button>搜尋</button></form></header><main><div class="eyebrow">SEARCH / 尋找喜歡的商品</div><h1 id="title">日本香煙 <span>搜尋結果</span></h1><p>按品牌縮小範圍，讓選擇更清楚。</p><section class="panel" aria-label="品牌篩選"><div class="label"><strong>品牌快篩</strong><button id="clear">清除品牌</button></div><div class="chips" id="chips"></div></section><div class="summary"><span id="status" role="status" aria-live="polite"></span><label>排序 <select id="sort"><option value="name">名稱 A–Z</option><option value="name-desc">名稱 Z–A</option></select></label></div><div id="error" hidden class="empty" role="alert">暫時無法載入品牌結果　<button class="retry" id="retry">重試</button></div><section class="grid" id="results" aria-label="商品結果"></section><div class="pager"><button id="prev">上一頁</button><span id="page"></span><button id="next">下一頁</button></div><div class="qa">原型測試面板：<label>模擬狀態 <select id="mode"><option value="normal">正常（450 ms 延遲）</option><option value="slow">慢速（1.8 秒）</option><option value="error">接口失敗</option></select></label><p>試試搜尋「不存在」或「品牌 B」。產品詳情只在本地彈窗展示；沒有登入、購物車、付款功能。</p></div></main><footer><span>首頁</span><span>分類</span><span>購物車</span><span>我的</span></footer><dialog id="detail"><h2 id="detailTitle"></h2><p>示範詳情 · 不連接實際商品、不產生交易</p><button id="closeDetail">關閉</button></dialog><script src="model.js"></script><script src="app.js"></script></body></html>
